name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: shellcheck + suites + validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # js-core/8: the engine suite (flow/engine/tests/run.mjs, wired into
      # tests/run.sh below) needs Node 18+ — pin it explicitly rather than
      # relying on whatever ships preinstalled.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: No runtime dependencies (zero-dep engine contract)
        run: |
          if [ -d node_modules ]; then
            echo "node_modules exists — the engine must have zero runtime deps" >&2
            exit 1
          fi

      # shellcheck is preinstalled on ubuntu-latest runners; the fallback below
      # installs it only if that ever changes.
      - name: Ensure shellcheck
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y shellcheck
          fi
          shellcheck --version

      # oracles/bash and oracles/js are byte-frozen (F3): a newer shellcheck
      # must never force an edit there, so the frozen copies are excluded.
      # oracles/check.sh is live code and stays linted. The live originals of
      # the frozen copies are linted until they are retired.
      - name: Shellcheck (all tracked *.sh except frozen oracles)
        run: git ls-files '*.sh' | grep -Ev '^oracles/(bash|js)/' | xargs shellcheck

      - name: Frozen oracles match MANIFEST.sha256
        run: bash oracles/check.sh

      - name: Contracts (schemas, goldens, exit codes)
        run: bash contracts/run.sh

      # js-core/8 fix round 2 (re-review Finding 5): this leg is the one that is
      # SUPPOSED to have jq — the whole jq half of the parity matrix (30 legs
      # plus the KNOWN DIVERGENCE pin) skips without it, and a skip-everything
      # run still exits 0 on its own. Assert rather than install: if the
      # ubuntu-latest image ever drops preinstalled jq we want to hear about it
      # loudly, not paper over it and keep believing the matrix ran. (The macOS
      # job installs instead, because jq is genuinely not on every macOS image.)
      - name: jq is present (this leg must run the jq half of the parity matrix)
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            echo "jq is not on PATH — the jq half of the parity matrix cannot run on this leg" >&2
            exit 1
          fi
          jq --version

      # Runs all six suites (spec, flow, adapters, engine, oracles,
      # contracts) via the combined aggregator — see tests/run.sh.
      - name: Test suites
        run: bash tests/run.sh

      - name: Engine suite standalone (with jq stripped from PATH)
        # The combined run above exercises the engine suite with this
        # runner's normal PATH (jq present). Re-run it standalone with jq
        # unreachable so the no-jq divergence/degrade paths threaded through
        # every *.test.mjs file (and parity.test.mjs's own no-jq leg) are
        # exercised for real, not just reasoned about — mirrors what the
        # bash suites already do for their own no-jq legs.
        #
        # VIBE_NO_JQ=1 declares that skipping the jq half here is DELIBERATE.
        # Without it the harness's jq-half gate fails the run, which is what
        # makes an accidentally jq-less runner distinguishable from this leg
        # (js-core/8 fix round 2, re-review Finding 5). The gate is also
        # bidirectional: if this strip ever stopped working, the jq legs would
        # execute despite the opt-in and the gate fails the step for that too.
        run: |
          NOJQ_BIN="$(mktemp -d)"
          for t in bash sh mkdir dirname basename date mktemp mv cp rm rmdir sed grep head tail cat env awk find readlink ln chmod cmp diff sort cksum node git; do
            p="$(command -v "$t" 2>/dev/null)" && ln -s "$p" "$NOJQ_BIN/$t"
          done
          PATH="$NOJQ_BIN" VIBE_NO_JQ=1 node flow/engine/tests/run.mjs

      # js-core/8 fix round 1 (review Minor 7): every *.mjs derives its own path
      # via fileURLToPath, never `new URL(import.meta.url).pathname`, because the
      # latter keeps percent-encoding and breaks on any path with a space. That
      # sweep is load-bearing but no other leg checks out into such a path, so a
      # reintroduction would ship green. This leg is the guard.
      - name: Engine suite from a path containing a space
        run: |
          SPACED="$(mktemp -d)/with space/vibe"
          mkdir -p "$SPACED"
          tar -cf - --exclude=.git . | tar -xf - -C "$SPACED"
          cd "$SPACED" && node flow/engine/tests/run.mjs

      # js-core/8 fix round 2 (re-review Minor 5, PRE-EXISTING since 8c97eff):
      # every Claude Code session exports CLAUDE_PROJECT_DIR, and the flow
      # suite's doctrine fixtures inherited it — reading the developer's live
      # cursor instead of the sandbox's, so the suite failed locally and passed
      # in CI, which sets nothing. The suite now scrubs it; this leg is what
      # keeps that true, because no other leg runs with the variable set.
      - name: Test suites under an ambient CLAUDE_PROJECT_DIR (hermeticity)
        env:
          CLAUDE_PROJECT_DIR: ${{ github.workspace }}
        run: bash tests/run.sh

      - name: Spec validation
        run: bash .agents/skills/spec/scripts/validate.sh

      - name: Drift gate (compound + doc drift)
        run: bash spec/scripts/check-drift.sh

  macos:
    # js-core/8: stock macOS ships bash 3.2 (Apple freezes it at the last
    # GPLv2 release) — the only way to know tests/run.sh's bash-3.2 fix
    # (parallel indexed arrays, no `declare -A`) actually works there, not
    # just that it was reasoned about. Runs the same aggregator as the
    # ubuntu job, invoked via the SYSTEM /bin/bash explicitly (not whatever
    # `bash` resolves to on PATH — GitHub's macOS runners also carry a
    # Homebrew bash 5+ that would silently mask a bash-3.2 regression).
    name: macOS (bash 3.2) — suites
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: System bash is really 3.2 (sanity — this job is pointless otherwise)
        # Asserts, not just prints: if Apple or the runner image ever ships a
        # newer /bin/bash this job silently stops testing what it claims while
        # staying green. Fail loudly instead and let a human retarget it.
        run: |
          v="$(/bin/bash --version | head -1)"
          echo "$v"
          case "$v" in
            *"version 3.2"*) ;;
            *) echo "/bin/bash is no longer 3.2 — this job no longer tests bash 3.2" >&2; exit 1 ;;
          esac

      - name: Ensure jq (not preinstalled on every macOS image)
        run: command -v jq >/dev/null 2>&1 || brew install jq

      - name: Test suites (via the real macOS /bin/bash, not Homebrew's)
        run: /bin/bash tests/run.sh

  rust-check:
    # F4: format, lint and dependency policy. cargo-deny enforces deny.toml:
    # banned crates, licenses, sources, duplicate versions, advisories.
    name: rust — fmt, clippy, deny
    runs-on: ubuntu-latest
    env:
      # fmt and clippy run on stable, the toolchain they were authored
      # against; rust-test's 1.88 leg proves MSRV.
      RUSTUP_TOOLCHAIN: stable
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Toolchain
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2

  rust-test:
    # F4: unit + integration tests on 3 OS × stable + MSRV. RUSTUP_TOOLCHAIN
    # overrides rust-toolchain.toml so the stable leg really runs stable.
    # Tests that spawn bash or compare the corpus byte-for-byte are
    # cfg(unix); Windows runs the rest.
    name: rust — test (${{ matrix.os }}, ${{ matrix.toolchain }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        toolchain: [stable, '1.88']
    runs-on: ${{ matrix.os }}
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Toolchain
        run: rustup toolchain install ${{ matrix.toolchain }} --profile minimal

      - name: Test
        run: cargo test --workspace --locked --no-fail-fast

  parity:
    # F3/F16: the frozen spec oracles against themselves, against the
    # vibe-spec candidate over the generated corpus, and live on this repo's
    # spec tree. Commands not ported yet stay self-check only.
    name: parity — spec oracles vs vibe-spec
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Toolchain (pinned by rust-toolchain.toml)
        run: rustup toolchain install

      - name: Spec parity (self-check, candidate, live)
        run: bash tests/parity/run.sh

  openspec:
    # F18 (P3c-R17): OpenSpec's own validator accepts vibe-spec's export of
    # tests/openspec/fixture and rejects a broken one. Pinned CLI via npx.
    name: openspec — validate an export
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Toolchain (pinned by rust-toolchain.toml)
        run: rustup toolchain install

      - name: OpenSpec gate
        run: bash tests/openspec/run.sh
